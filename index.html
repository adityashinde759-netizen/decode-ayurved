<script data-purpose="modal-and-submission-handler">

const DECODE_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxHNCZqqsurj_qUf4q5Ka03QZm7o8_1BcEO4k83sHjKnbNLS259rLt_3EKeI-tuCpK3eA/exec";

window.DECODE_MODAL = {
  modal: document.getElementById("signupModal"),
  container: document.getElementById("modalContainer"),
  formView: document.getElementById("modalFormView"),
  successView: document.getElementById("modalSuccessView"),
  form: document.getElementById("decodeRegistrationForm"),

  openModal: function() {
    if (!this.modal) return;

    this.formView.classList.remove("hidden");
    this.successView.classList.add("hidden");

    this.modal.classList.remove(
      "opacity-0",
      "pointer-events-none"
    );

    this.modal.classList.add(
      "opacity-100",
      "pointer-events-auto"
    );

    this.container.classList.remove("scale-95");
    this.container.classList.add("scale-100");

    setTimeout(function() {
      const nameInput =
        document.getElementById("studentName");

      if (nameInput) {
        nameInput.focus();
      }
    }, 150);
  },

  closeModal: function() {
    if (!this.modal) return;

    this.modal.classList.remove(
      "opacity-100",
      "pointer-events-auto"
    );

    this.modal.classList.add(
      "opacity-0",
      "pointer-events-none"
    );

    this.container.classList.remove("scale-100");
    this.container.classList.add("scale-95");
  },

  handleSubmit: async function(e) {

    e.preventDefault();

    const nameInput =
      document.getElementById("studentName");

    const mobileInput =
      document.getElementById("studentMobile");

    const emailInput =
      document.getElementById("subscriberEmail");

    const submitBtn =
      document.getElementById("modalSubmitBtn");

    if (!nameInput || !mobileInput || !emailInput) {
      alert("Registration form is not available.");
      return;
    }

    const name =
      nameInput.value.trim();

    const mobile =
      mobileInput.value.trim();

    const email =
      emailInput.value.trim();

    if (!name || !mobile || !email) {
      alert("Please fill all details.");
      return;
    }

    if (submitBtn) {
      submitBtn.innerText = "Registering...";
      submitBtn.disabled = true;
    }

    try {

      const formData = new FormData();

      formData.append("name", name);
      formData.append("mobile", mobile);
      formData.append("email", email);

      const response = await fetch(
        DECODE_SCRIPT_URL,
        {
          method: "POST",
          body: formData
        }
      );

      const result =
        await response.json();

      console.log(
        "DECODE Registration Response:",
        result
      );

      if (result.status === "success") {

        this.formView.classList.add("hidden");
        this.successView.classList.remove("hidden");

        this.form.reset();

        return;
      }

      if (result.status === "duplicate") {

        const successHeading =
          document.querySelector(
            "#modalSuccessView h3"
          );

        const successText =
          document.querySelector(
            "#modalSuccessView p"
          );

        if (successHeading) {
          successHeading.innerText =
            "You're already on the DECODE list!";
        }

        if (successText) {
          successText.innerText =
            "This Gmail address has already been registered for DECODE Ayurveda.";
        }

        this.formView.classList.add("hidden");
        this.successView.classList.remove("hidden");

        return;
      }

      throw new Error(
        result.message ||
        "Registration failed."
      );

    } catch (error) {

      console.error(
        "DECODE registration error:",
        error
      );

      alert(
        "Something went wrong while registering. Please try again."
      );

    } finally {

      if (submitBtn) {
        submitBtn.innerText = "Join DECODE";
        submitBtn.disabled = false;
      }

    }

  }
};


window.addEventListener(
  "click",
  function(e) {

    const modal =
      document.getElementById("signupModal");

    const container =
      document.getElementById("modalContainer");

    if (
      e.target === modal &&
      !container.contains(e.target)
    ) {

      window.DECODE_MODAL.closeModal();

    }

  }
);


window.addEventListener(
  "keydown",
  function(e) {

    if (e.key === "Escape") {
      window.DECODE_MODAL.closeModal();
    }

  }
);

</script></body></html>
